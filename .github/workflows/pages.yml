---
name: GitHub Pages

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install poetry
        run: pipx install poetry
    
      - name: Check pyproject.toml and poetry.lock
        run: poetry check

  documents:
    needs:
      - quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tags if not run from main repo
        if: github.repository != 'margo/specification'
        run: |
          git remote add upstream https://github.com/margo/specification
          git fetch upstream --tags

      - name: Install poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction --all-extras

      - name: Generate MarkDown documentation
        run: |
          data-model/tools/generate-docs.bash

      - name: Share generated documentation with later jobs
        run: tar -cf merged.tar merged
      - uses: actions/upload-artifact@v4
        with:
          name: generated-documentation
          path: merged.tar

  pages:
    needs:
      - documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install the project dependencies
        run: poetry install --no-interaction --all-extras

      - name: Get generated documentation from previous jobs
        uses: actions/download-artifact@v4
        with:
          name: generated-documentation

      - name: Extract generated documentation
        run: tar -xf merged.tar

      - name: Build Pages
        run: poetry run -- mkdocs build

      - name: GitHub Pages Deploy
        # only deploy if we are on the default branch
        if: ${{ github.ref == 'refs/heads/pre-draft' || github.ref == 'refs/heads/data-model-generation-result' }}
        run: poetry run -- mkdocs gh-deploy --force --clean --verbose

      - name: Upload pages
        uses: actions/upload-artifact@v4
        if: ${{ github.ref != 'refs/heads/pre-draft' || github.ref != 'refs/heads/data-model-generation-result' }}
        with:
          name: margo-specification
          path: site
          retention-days: 5
